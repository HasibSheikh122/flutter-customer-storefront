name: Multi-Tenant Customer White-Label Storefront Flutter Build

on:
  repository_dispatch:
    types: [generate_merchant_app]
  workflow_dispatch:
    inputs:
      store_domain:
        description: 'Merchant Store Domain'
        required: true
        default: 'bestbdbazar.shop.xylotechsolution.com'
      subdomain:
        description: 'Merchant Subdomain'
        required: true
        default: 'bestbdbazar'
      app_name:
        description: 'Branded Store App Name'
        required: true
        default: 'BestBdBazar'
      primary_color:
        description: 'Primary Brand Hex Color'
        required: true
        default: '#059669'
      secondary_color:
        description: 'Secondary Brand Hex Color'
        required: false
        default: '#047857'
      bundle_id:
        description: 'Android / iOS Package Bundle ID'
        required: false
        default: 'com.xylosaas.bestbdbazar.store'
      app_icon_url:
        description: 'Merchant Uploaded Company App Icon URL'
        required: false
        default: ''
      callback_upload_url:
        description: 'Django Backend Callback Upload URL'
        required: false
        default: ''

jobs:
  build_android_apk:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.client_payload.build_target == 'store_apk' || github.event.client_payload.build_target == 'store_app' || github.event.client_payload.build_target == 'all' || github.event.client_payload.build_target == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Customer Storefront Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Inject Store Branding, Launcher Icon, Package ID & Tenant Config
        env:
          STORE_DOMAIN: ${{ github.event.client_payload.store_domain || github.event.inputs.store_domain || 'bestbdbazar.shop.xylotechsolution.com' }}
          SUBDOMAIN: ${{ github.event.client_payload.subdomain || github.event.inputs.subdomain || 'bestbdbazar' }}
          APP_NAME: ${{ github.event.client_payload.app_name || github.event.inputs.app_name || 'BestBdBazar' }}
          APP_SLOGAN: ${{ github.event.client_payload.app_slogan || 'Authentic Online Shopping' }}
          BUNDLE_ID: ${{ github.event.client_payload.bundle_id || github.event.inputs.bundle_id || 'com.xylosaas.bestbdbazar.store' }}
          PRIMARY_COLOR: ${{ github.event.client_payload.primary_color || github.event.inputs.primary_color || '#059669' }}
          SECONDARY_COLOR: ${{ github.event.client_payload.secondary_color || github.event.inputs.secondary_color || '#047857' }}
          APP_ICON_URL: ${{ github.event.client_payload.app_icon_url || github.event.inputs.app_icon_url || '' }}
        run: |
          pip install Pillow
          python3 -c '
          import os, json, shutil, urllib.request
          from PIL import Image

          sub = os.environ["SUBDOMAIN"].strip().lower()
          dom = os.environ["STORE_DOMAIN"].strip().lower()
          name = os.environ["APP_NAME"].strip()
          slogan = os.environ["APP_SLOGAN"].strip()
          bundle = os.environ["BUNDLE_ID"].strip()
          p_col = os.environ["PRIMARY_COLOR"].strip()
          s_col = os.environ["SECONDARY_COLOR"].strip()
          icon_url = os.environ["APP_ICON_URL"].strip()

          os.makedirs("assets/icon", exist_ok=True)
          os.makedirs("assets/images", exist_ok=True)

          img = None
          if icon_url:
              try:
                  req = urllib.request.Request(icon_url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      raw = r.read()
                  with open("assets/icon/app_icon.png", "wb") as f:
                      f.write(raw)
                  img = Image.open("assets/icon/app_icon.png").convert("RGBA")
              except Exception as e:
                  print("Icon download warning:", e)

          if img is None:
              img = Image.new("RGBA", (512, 512), (5, 150, 105, 255))

          sq = Image.new("RGBA", (512, 512), (255, 255, 255, 255))
          cp = img.copy()
          cp.thumbnail((512, 512), Image.Resampling.LANCZOS)
          sq.paste(cp, ((512 - cp.width) // 2, (512 - cp.height) // 2), cp)
          sq.save("assets/icon/app_icon.png", format="PNG")
          sq.save("assets/images/app_icon.png", format="PNG")

          res_root = "android/app/src/main/res"
          for anydpi in ("mipmap-anydpi-v26", "mipmap-anydpi"):
              shutil.rmtree(os.path.join(res_root, anydpi), ignore_errors=True)

          for folder, px in {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}.items():
              d = os.path.join(res_root, folder)
              os.makedirs(d, exist_ok=True)
              resized = sq.resize((px, px), Image.Resampling.LANCZOS)
              resized.save(os.path.join(d, "ic_launcher.png"), format="PNG")
              resized.save(os.path.join(d, "ic_launcher_round.png"), format="PNG")

          with open("assets/tenant_config.json", "w", encoding="utf-8") as f:
              json.dump({
                  "subdomain": sub,
                  "store_domain": dom,
                  "api_base_url": f"https://{dom}",
                  "app_name": name,
                  "store_name": name,
                  "app_slogan": slogan,
                  "bundle_id": bundle,
                  "primary_color": p_col,
                  "secondary_color": s_col,
                  "app_icon_url": icon_url,
                  "is_admin_app": False,
                  "strict_tenant_lock": True,
              }, f, indent=2, ensure_ascii=False)
          '

      - name: Initialize Android & Dependencies
        run: |
          flutter config --enable-android
          flutter pub get

      - name: Build Signed White-Label Android APK
        run: |
          DOMAIN="${{ github.event.client_payload.store_domain || github.event.inputs.store_domain || 'bestbdbazar.shop.xylotechsolution.com' }}"
          SUB="${{ github.event.client_payload.subdomain || github.event.inputs.subdomain || 'bestbdbazar' }}"
          NAME="${{ github.event.client_payload.app_name || github.event.inputs.app_name || 'BestBdBazar' }}"
          SLOGAN="${{ github.event.client_payload.app_slogan || 'Authentic Online Shopping' }}"
          ICON="${{ github.event.client_payload.app_icon_url || github.event.inputs.app_icon_url || '' }}"
          COLOR="${{ github.event.client_payload.primary_color || github.event.inputs.primary_color || '#059669' }}"
          SCOLOR="${{ github.event.client_payload.secondary_color || github.event.inputs.secondary_color || '#047857' }}"
          BUNDLE="${{ github.event.client_payload.bundle_id || github.event.inputs.bundle_id || 'com.xylosaas.bestbdbazar.store' }}"
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=STORE_DOMAIN="$DOMAIN" \
            --dart-define=TENANT_SUBDOMAIN="$SUB" \
            --dart-define=APP_NAME="$NAME" \
            --dart-define=APP_SLOGAN="$SLOGAN" \
            --dart-define=APP_ICON_URL="$ICON" \
            --dart-define=PRIMARY_COLOR="$COLOR" \
            --dart-define=SECONDARY_COLOR="$SCOLOR" \
            --dart-define=BUNDLE_ID="$BUNDLE"

      - name: Upload Compiled Store APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: storefront-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Push Compiled Store APK Directly to Django Backend
        if: ${{ (github.event.client_payload.callback_upload_url || github.event.inputs.callback_upload_url) != '' }}
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_upload_url || github.event.inputs.callback_upload_url }}
          SUB: ${{ github.event.client_payload.subdomain || github.event.inputs.subdomain || 'bestbdbazar' }}
          DOM: ${{ github.event.client_payload.store_domain || github.event.inputs.store_domain || 'bestbdbazar.shop.xylotechsolution.com' }}
        run: |
          curl -k -L -X POST "$CALLBACK_URL" \
            -H "X-Tenant-Subdomain: $SUB" \
            -H "X-Tenant-Domain: $DOM" \
            -F "subdomain=$SUB" \
            -F "build_status=ready" \
            -F "store_apk_file=@build/app/outputs/flutter-apk/app-release.apk;filename=${SUB}-store-android.apk" || true

  build_windows_exe:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.client_payload.build_target == 'store_windows' || github.event.client_payload.build_target == 'store_app' || github.event.client_payload.build_target == 'all' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Initialize Windows & Dependencies
        run: |
          flutter config --enable-windows-desktop
          flutter create . --platforms=windows --project-name xylo_customer_storefront
          flutter pub get

      - name: Build Windows Storefront Executable (.exe)
        run: |
          $DOMAIN = "${{ github.event.client_payload.store_domain || github.event.inputs.store_domain || 'bestbdbazar.shop.xylotechsolution.com' }}"
          $SUB = "${{ github.event.client_payload.subdomain || github.event.inputs.subdomain || 'bestbdbazar' }}"
          $NAME = "${{ github.event.client_payload.app_name || github.event.inputs.app_name || 'BestBdBazar' }}"
          $COLOR = "${{ github.event.client_payload.primary_color || github.event.inputs.primary_color || '#059669' }}"
          flutter build windows --release `
            --dart-define=STORE_DOMAIN=$DOMAIN `
            --dart-define=TENANT_SUBDOMAIN=$SUB `
            --dart-define=APP_NAME="$NAME" `
            --dart-define=PRIMARY_COLOR="$COLOR"

      - uses: actions/upload-artifact@v4
        with:
          name: storefront-windows-exe
          path: build/windows/x64/runner/Release/

      - name: Push Compiled Store Windows Build to Django Backend
        if: ${{ (github.event.client_payload.callback_upload_url || github.event.inputs.callback_upload_url) != '' }}
        shell: bash
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_upload_url || github.event.inputs.callback_upload_url }}
          SUB: ${{ github.event.client_payload.subdomain || github.event.inputs.subdomain || 'bestbdbazar' }}
          DOM: ${{ github.event.client_payload.store_domain || github.event.inputs.store_domain || 'bestbdbazar.shop.xylotechsolution.com' }}
        run: |
          curl -k -L -X POST "$CALLBACK_URL" \
            -H "X-Tenant-Subdomain: $SUB" \
            -H "X-Tenant-Domain: $DOM" \
            -F "subdomain=$SUB" \
            -F "build_status=ready" \
            -F "store_windows_file=@build/windows/x64/runner/Release/xylo_customer_storefront.exe;filename=${SUB}-store-windows.exe" || true

  build_apple_ios:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.client_payload.build_target == 'store_ios' || github.event.client_payload.build_target == 'store_app' || github.event.client_payload.build_target == 'all' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Initialize iOS & Dependencies
        run: |
          flutter create . --platforms=ios --project-name xylo_customer_storefront --org com.xylosaas
          flutter pub get

      - name: Build iOS White-Label IPA (No Codesign)
        run: |
          DOMAIN="${{ github.event.client_payload.store_domain || github.event.inputs.store_domain || 'bestbdbazar.shop.xylotechsolution.com' }}"
          SUB="${{ github.event.client_payload.subdomain || github.event.inputs.subdomain || 'bestbdbazar' }}"
          NAME="${{ github.event.client_payload.app_name || github.event.inputs.app_name || 'BestBdBazar' }}"
          COLOR="${{ github.event.client_payload.primary_color || github.event.inputs.primary_color || '#059669' }}"
          flutter build ios --release --no-codesign \
            --dart-define=STORE_DOMAIN="$DOMAIN" \
            --dart-define=TENANT_SUBDOMAIN="$SUB" \
            --dart-define=APP_NAME="$NAME" \
            --dart-define=PRIMARY_COLOR="$COLOR"
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r store-release.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: storefront-ios-ipa
          path: store-release.ipa

      - name: Push Compiled Store iOS IPA to Django Backend
        if: ${{ (github.event.client_payload.callback_upload_url || github.event.inputs.callback_upload_url) != '' }}
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_upload_url || github.event.inputs.callback_upload_url }}
          SUB: ${{ github.event.client_payload.subdomain || github.event.inputs.subdomain || 'bestbdbazar' }}
          DOM: ${{ github.event.client_payload.store_domain || github.event.inputs.store_domain || 'bestbdbazar.shop.xylotechsolution.com' }}
        run: |
          curl -k -L -X POST "$CALLBACK_URL" \
            -H "X-Tenant-Subdomain: $SUB" \
            -H "X-Tenant-Domain: $DOM" \
            -F "subdomain=$SUB" \
            -F "build_status=ready" \
            -F "store_ios_file=@store-release.ipa;filename=${SUB}-store-ios.ipa" || true